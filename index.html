<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरी पहली वेबसाइट</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            padding: 50px 15px;
        }

        .box {
            background: rgba(255,255,255,0.1);
            padding: 30px 15px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #ffd700;
        }

        button {
            background: #00c853;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>🎉 मेरी पहली वेबसाइट!</h1>

        <p>नमस्ते दोस्तों! 👋</p>

        <p>यह वेबसाइट मैंने GitHub की मदद से बनाई है।</p>

        <button onclick="alert('स्वागत है! 🎉')">
            यहाँ क्लिक करो
        </button>
    </div>
</body>
</html>
